# MySQL and the app together:  docker compose up --build
# Then open http://localhost:3000
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: moneybook
      MYSQL_USER: moneybook
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moneybook_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - db-data:/var/lib/mysql      # the books survive restarts
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    environment:
      MYSQL_HOST: db
      MYSQL_USER: moneybook
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-moneybook_dev_password}
      MYSQL_DATABASE: moneybook
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Bangkok}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
